# Manual SDK release workflow — triggered via workflow_dispatch only.
#
# Canonical delivery channel: the public npm registry (`@trdlabs/sdk`).
# The npm registry is immutable per version, so publishing is the release.
# A GitHub tag + release is created only as a SECONDARY release note after a
# successful npm publish — it carries NO consumer tarball and is not a delivery
# channel. `npm pack` / `sdk:verify` are verification-only, never delivery.
#
# Authentication:
#   Publishing uses the `NPM_TOKEN` repository secret (an npm automation/granular
#   token scoped to publish `@trdlabs/sdk`), consumed as `NODE_AUTH_TOKEN`. The
#   token value lives only in GitHub Actions secrets, never in git.
#   Provenance is generated via GitHub OIDC (`id-token: write`), so the published
#   version carries a verifiable build attestation.
#   If/when a trusted publisher (OIDC) is configured for `@trdlabs/sdk` on
#   npmjs.com, the `NODE_AUTH_TOKEN` env can be dropped in favour of pure OIDC.
name: SDK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to npm (must equal package.json version, e.g. 0.10.0)'
        required: true
        type: string

permissions:
  contents: write   # secondary git tag + release note only
  id-token: write   # npm provenance attestation (Sigstore via GitHub OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # ── Fail-closed pre-flight checks ──────────────────────────────────────

      - name: Validate version format (semver only)
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.env.VERSION ?? "")) process.exit(1)'

      - name: Assert package name is @trdlabs/sdk
        run: |
          test "$(node -p "require('./package.json').name")" = "@trdlabs/sdk"

      - name: Assert package.json version matches input
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"

      # Proceeds ONLY on a confirmed E404. An already-published version fails, and so
      # does any indeterminate registry/DNS/auth error — we never publish on an
      # unverified "looks absent" state. Logic is unit-tested (see
      # test/assert-version-publishable.test.ts).
      - name: Fail closed unless this version is confirmably absent from npm
        run: npx tsx scripts/assert-version-publishable.ts "@trdlabs/sdk" "$VERSION"

      - name: Refuse if secondary git tag already exists
        run: |
          ! git ls-remote --exit-code --tags origin "refs/tags/sdk-v$VERSION" >/dev/null 2>&1

      # ── Build and verify (verification only — not delivery) ────────────────

      # Единый вход, тот же самый, что гоняет pr-check.yml на каждом PR: test → build →
      # conformance:validation (обязательный release gate из AGENTS.md «Перед релизом» —
      # 017-фикстуры через published surface @trdlabs/sdk/validation; идёт ПОСЛЕ build, потому что
      # harness импортирует dist/). Состав живёт в package.json, в одном месте: перечисление шагов
      # здесь и в pr-check — это ровно тот дрейф, из-за которого «зелёный на PR» и «зелёный на
      # релизе» перестают значить одно и то же.
      - name: Gate (npm run check)
        run: npm run check

      - name: Pack SDK (verification)
        run: npm run sdk:pack

      - name: Verify packed SDK (verification)
        run: npm run sdk:verify

      # ── Publish to npm (canonical delivery channel) ────────────────────────

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `npm publish --provenance` exiting 0 is NOT evidence the provenance attestation
      # was actually generated: the attestation is minted by a GitHub OIDC exchange that
      # runs as a SIDE EFFECT of publish, and a failed exchange does not fail the publish
      # command itself. This is not hypothetical — it happened for real in the sibling
      # package `@trdlabs/engine`: the publish step logged success, attestations silently
      # never generated, and it surfaced only after the release had already shipped. The
      # npm registry is immutable per version, so the only available fix was forward, as
      # a new version — there is no way to repair the one that shipped. This step asks
      # the REGISTRY, not the previous step's log, whether this exact just-published
      # version carries `dist.attestations`, and fails closed (non-zero exit) on a
      # confirmed absence OR on any indeterminate registry/network answer — same
      # fail-closed discipline as scripts/assert-version-publishable.ts above. It must
      # run before the git tag / release note below: that tag promises a provenance-
      # backed release, and must not exist if provenance does not.
      - name: Fail closed unless npm confirms provenance attestations for this version
        run: npx tsx scripts/assert-provenance-attested.ts "@trdlabs/sdk" "$VERSION"

      # ── Secondary GitHub release NOTE (after successful npm publish) ────────
      # Not a delivery channel: no package asset is attached. Consumers install
      # from npm. This only records a human-readable release note + git tag.

      - name: Create secondary git tag and release note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "sdk-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "@trdlabs/sdk $VERSION" \
            --notes "Published to npm (canonical delivery): https://www.npmjs.com/package/@trdlabs/sdk/v/$VERSION

          Install:

              npm install @trdlabs/sdk@$VERSION

          This GitHub release is a secondary release note only. No package archive is attached here — npm is the sole consumer delivery channel."
